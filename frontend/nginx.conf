upstream api_upstream {
    server the_beauty_town_api:5000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Long-cache built assets (vite hashes filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The base image's default mime.types doesn't know this newer
    # extension, so without this it'd fall back to application/octet-stream
    # — some browsers are strict about a PWA manifest's content-type.
    # Scoped to just this one file (default_type in a location block, not a
    # server-wide `types {}` block, which would replace — not extend — the
    # whole MIME table and break every other file on the site).
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Proxy API to backend container
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Proxy uploaded files served by backend
    location /uploads/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — all unknown routes serve index.html so React Router works
    location / {
        try_files $uri $uri/ /index.html;
    }
}
