<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="oklch(0.22 0.07 15)" />
    <meta name="mobile-web-app-capable" content="yes" />

         the page URL fine — swap to absolute URLs once a production domain
         is set (see CLIENT_URL in the backend's .env). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Beauty Town" />
    <meta property="og:title" content="The Beauty Town — Makeup Studio in Vadodara" />
    <meta
      property="og:description"
      content="Celebrity makeup artist Payal Shah's studio and salon in Vadodara — bridal makeup, hair, skin, nails, and a professional makeup academy."
    />
    <meta property="og:image" content="/brand/hero-bg.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
