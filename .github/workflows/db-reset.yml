name: Production Go-Live Reset

# One-time, manually-triggered operation — wipes test-era transactional
# data (sales, appointments, customers, extra staff, coupons, reviews,
# holidays, audit log) before the real client starts using the system,
# while leaving the catalog (services/packages/products), business
# settings, one admin, and one staff account untouched.
#
# ALWAYS takes a full pg_dump backup first, regardless of the `confirm`
# input. The destructive step only runs when `confirm` is exactly RESET —
# any other value (including the default) performs a backup-only dry run
# and stops there, so this can never delete anything by accident.
#
# This workflow should be REMOVED from the repo once it's done its job —
# it's not something that should sit in CI indefinitely.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESET (exact case) to actually delete data. Anything else = backup only, no deletion.'
        required: true
        default: 'backup-only'

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Backup, and reset if confirmed
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: CONFIRM
          script: |
            set -e
            cd /var/www/the-beauty-town

            # Read just the 5 vars we need out of .env.api without ever
            # printing them (no `set -x`, nothing below echoes $PGPASSWORD).
            # NOT sourced as a script: Docker's env_file format is more
            # lenient than real shell syntax (values don't need to be
            # shell-quoted), so some other var in this file (SMTP/VAPID/
            # OAuth secrets etc.) can easily contain characters that break
            # bash's `source` even though Docker parses the file fine.
            get_var() { grep -E "^$1=" .env.api | tail -1 | cut -d= -f2-; }
            PGHOST=$(get_var PGHOST)
            PGPORT=$(get_var PGPORT)
            PGUSER=$(get_var PGUSER)
            PGPASSWORD=$(get_var PGPASSWORD)
            PGDATABASE=$(get_var PGDATABASE)

            PG_IMAGE="postgres:17-alpine"
            NET_ARGS="--add-host=host.docker.internal:host-gateway"

            mkdir -p backups
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            BACKUP_FILE="backups/pre-reset-${TIMESTAMP}.sql"

            echo "==> Taking full backup -> ${BACKUP_FILE}"
            docker run --rm $NET_ARGS -e PGPASSWORD="$PGPASSWORD" "$PG_IMAGE" \
              pg_dump -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" \
              > "$BACKUP_FILE"

            BACKUP_BYTES=$(wc -c < "$BACKUP_FILE")
            echo "==> Backup size: ${BACKUP_BYTES} bytes"
            if [ "$BACKUP_BYTES" -lt 1000 ]; then
              echo "!! Backup looks empty/too small — aborting before touching any data."
              exit 1
            fi

            echo "==> Row counts BEFORE:"
            docker run --rm -i $NET_ARGS -e PGPASSWORD="$PGPASSWORD" "$PG_IMAGE" \
              psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" <<'COUNTS'
            SELECT
              (SELECT COUNT(*) FROM sales) AS sales,
              (SELECT COUNT(*) FROM appointments) AS appointments,
              (SELECT COUNT(*) FROM users WHERE role='customer') AS customers,
              (SELECT COUNT(*) FROM users WHERE role='staff') AS staff,
              (SELECT COUNT(*) FROM users WHERE role='admin') AS admins,
              (SELECT COUNT(*) FROM coupons) AS coupons,
              (SELECT COUNT(*) FROM reviews) AS reviews,
              (SELECT COUNT(*) FROM salon_holidays) AS holidays,
              (SELECT COUNT(*) FROM audit_logs) AS audit_logs;
            COUNTS

            if [ "$CONFIRM" != "RESET" ]; then
              echo "==> confirm input was '$CONFIRM', not RESET — backup-only run, stopping here."
              exit 0
            fi

            echo "==> confirm=RESET — proceeding with the wipe."
            docker run --rm -i $NET_ARGS -e PGPASSWORD="$PGPASSWORD" "$PG_IMAGE" \
              psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -v ON_ERROR_STOP=1 <<'RESET_SQL'
            BEGIN;

            DELETE FROM sales;
            DELETE FROM appointments;
            DELETE FROM coupons;
            DELETE FROM reviews;
            DELETE FROM salon_holidays;
            DELETE FROM audit_logs;

            DELETE FROM users
              WHERE role IN ('customer', 'staff')
                AND email_lower <> 'sneha.staff@salon.com';

            DELETE FROM users
              WHERE role = 'admin'
                AND email_lower <> 'admin@salon.com';

            DELETE FROM refresh_tokens
              WHERE user_id IN (
                SELECT id FROM users WHERE email_lower IN ('sneha.staff@salon.com', 'admin@salon.com')
              );
            DELETE FROM push_subscriptions
              WHERE user_id IN (
                SELECT id FROM users WHERE email_lower IN ('sneha.staff@salon.com', 'admin@salon.com')
              );
            DELETE FROM otp_tokens;

            UPDATE users SET failed_login_attempts = 0, locked_until = NULL, last_login_at = NULL
              WHERE email_lower IN ('sneha.staff@salon.com', 'admin@salon.com');

            COMMIT;
            RESET_SQL

            echo "==> Row counts AFTER:"
            docker run --rm -i $NET_ARGS -e PGPASSWORD="$PGPASSWORD" "$PG_IMAGE" \
              psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" <<'COUNTS_AFTER'
            SELECT
              (SELECT COUNT(*) FROM sales) AS sales,
              (SELECT COUNT(*) FROM appointments) AS appointments,
              (SELECT COUNT(*) FROM users WHERE role='customer') AS customers,
              (SELECT COUNT(*) FROM users WHERE role='staff') AS staff,
              (SELECT COUNT(*) FROM users WHERE role='admin') AS admins,
              (SELECT COUNT(*) FROM coupons) AS coupons,
              (SELECT COUNT(*) FROM reviews) AS reviews,
              (SELECT COUNT(*) FROM salon_holidays) AS holidays,
              (SELECT COUNT(*) FROM audit_logs) AS audit_logs;
            COUNTS_AFTER

            echo "==> Done. Backup kept at ${BACKUP_FILE}"
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
